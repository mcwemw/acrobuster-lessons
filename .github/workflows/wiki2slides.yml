name: wiki2slides — Generate Teaching Slides

on:
  push:
    paths:
      - 'wiki/pages/**/*.md'

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install anthropic pyyaml

      - name: Detect changed wiki pages
        id: changed
        run: |
          # Find .md files changed in wiki/pages/ vs the previous commit
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'wiki/pages/**/*.md' 2>/dev/null \
            || git show --name-only --format="" HEAD -- 'wiki/pages/**/*.md')
          echo "files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGED" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "Changed files: $CHANGED"

      - name: Generate HTML slides
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          FILES="${{ steps.changed.outputs.files }}"
          if [ -z "$FILES" ]; then
            echo "No wiki pages changed, skipping generation."
            exit 0
          fi
          GENERATED=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "▶ Generating slides for: $f"
            python tools/wiki2slides.py "$f"
            GENERATED=$((GENERATED+1))
          done <<< "$FILES"
          echo "Generated $GENERATED slide file(s)."

      - name: Check for new/changed HTML files
        id: diff_html
        run: |
          git add genai/*.html 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create PR branch and open pull request
        if: steps.diff_html.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="wiki2slides/$(date +%Y%m%d-%H%M%S)"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -m "feat(slides): auto-generate teaching slides from wiki pages

          Generated by wiki2slides pipeline on push to wiki/pages/

          Co-Authored-By: Claude Sonnet 4.6 <noreply@anthropic.com>"
          git push origin "$BRANCH"

          # List changed HTML files for PR body
          CHANGED_HTML=$(git diff origin/main..."$BRANCH" --name-only -- 'genai/*.html')

          gh pr create \
            --title "slides: auto-generated from wiki page update" \
            --body "## Changes
          Auto-generated HTML teaching slides from updated wiki pages.

          **Files updated:**
          \`\`\`
          $CHANGED_HTML
          \`\`\`

          ## Review checklist
          - [ ] Slide count is appropriate (5–9 slides)
          - [ ] Each slide cites a valid wiki section
          - [ ] No research synthesis / unpublished content leaked
          - [ ] Title slide has correct question from frontmatter
          - [ ] Summary slide has 3 clear takeaways
          - [ ] HTML renders correctly in browser

          🤖 Generated with [Claude Code](https://claude.com/claude-code)" \
            --base main \
            --head "$BRANCH"
